<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Learning Center{% endblock %}</title>
    <!-- Dyslexia-Friendly Fonts (Lexend) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Dyslexia Global Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dyslexia.css') }}">
    <!-- Calculator Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calculator.css') }}">
    <!-- Chatbot Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">

    {% block extra_styles %}{% endblock %}
    <style>
        #account-navigation {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid rgba(148, 163, 184, .55);
            border-radius: 999px;
            background: rgba(15, 23, 42, .9);
            color: #f8fafc;
            font: 600 12px/1.2 'Lexend', sans-serif;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
        }
        #account-navigation a,
        #account-navigation button {
            border: 0;
            padding: 4px 7px;
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        #account-navigation a:hover,
        #account-navigation button:hover { background: rgba(255, 255, 255, .16); }
        #account-navigation form { margin: 0; }
        @media (max-width: 600px) {
            #account-navigation { top: 6px; right: 6px; gap: 2px; padding: 5px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <!-- Page Content -->
    {% block content %}{% endblock %}

    <nav id="account-navigation" aria-label="Account">
        {% if current_account_name %}
            <a href="{{ url_for('account_dashboard') }}">👤 {{ current_account_name }}</a>
            <a href="{{ url_for('leaderboards') }}">Leaderboards</a>
            <a href="{{ url_for('community_profiles') }}">Community</a>
            <form method="post" action="{{ url_for('account_logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{{ url_for('account_login') }}">Log in</a>
            <a href="{{ url_for('account_register') }}">Sign up</a>
        {% endif %}
    </nav>
    
    <!-- Calculator JS -->
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
    <script>
        // Initialize calculator if function exists
        if(typeof createCalculatorHTML === 'function') {
            createCalculatorHTML();
        }
    </script>

    <!-- Chatbot JS -->
    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
