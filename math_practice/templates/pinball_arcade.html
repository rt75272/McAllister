<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinball Arcade - Mrs. McAllister's Learning Center</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            background: radial-gradient(circle at 15% 10%, #f59e0b 0, transparent 40%), radial-gradient(circle at 80% 20%, #ec4899 0, transparent 45%), #020617;
            color: #e2e8f0;
        }

        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .top h1 {
            margin: 0;
            font-size: clamp(1.2rem, 2.8vw, 1.8rem);
            color: #fde68a;
        }

        .back-btn {
            text-decoration: none;
            color: #f8fafc;
            background: linear-gradient(120deg, #0ea5e9, #6366f1);
            border: 1px solid #7dd3fc;
            border-radius: 10px;
            font-weight: 700;
            padding: 8px 12px;
            white-space: nowrap;
        }

        .frame-wrap {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.45);
        }

        iframe {
            width: 100%;
            height: min(78vh, 760px);
            border: 1px solid #334155;
            border-radius: 10px;
            background: #020617;
        }

        .fallback {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: rgba(2, 6, 23, 0.65);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .launch-btn {
            display: inline-block;
            text-decoration: none;
            margin-top: 8px;
            background: #7c2d12;
            border: 1px solid #f59e0b;
            color: #f8fafc;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="top">
        <h1>Pinball Lab (Hosted)</h1>
        <a class="back-btn" href="{{ request.args.get('return_to') or url_for('game_planet') }}">Back</a>
    </div>

    <div class="frame-wrap">
        <iframe
            src="https://playpager.com/embed/pinball-online/"
            title="Hosted Pinball"
            loading="lazy"
            allowfullscreen>
        </iframe>

        <div class="fallback">
            If the embedded game does not load on your network, open it in a new tab:
            <br>
            <a class="launch-btn" href="https://playpager.com/pinball-online/" target="_blank" rel="noopener">Launch Hosted Pinball</a>
        </div>
    </div>
</div>
</body>
</html>
